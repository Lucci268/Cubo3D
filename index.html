<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo Magico 3D Premium - Three.js</title>
  
  <style>
    /* Remove margens padrao do navegador para evitar barras de rolagem indesejadas */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* Aplica um fundo com degrade radial, esconde transbordamentos e define a fonte do projeto */
    body { 
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); 
      overflow: hidden; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      color: #fff; 
    }
    /* Garante que o elemento do 3D preencha a tela sem deixar espacos em branco */
    canvas { display: block; }

    /* Container invisivel que ocupa toda a tela para alinhar os elementos da interface */
    #ui-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; /* Permite que o clique atravesse o container e chegue no canvas 3D */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Estilo base para todos os paineis da interface, criando um efeito de vidro escuro */
    .panel {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 25px;
      pointer-events: all; /* Reativa os cliques apenas dentro das caixas dos paineis */
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    /* Formatacao especifica do cabecalho */
    #header { align-self: center; text-align: center; }
    #header h1 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: #ffdd55; margin-bottom: 5px; }
    #header p { font-size: 12px; color: #aaa; }

    /* Container dos botoes de controle */
    #controls-panel { align-self: center; display: flex; flex-direction: column; gap: 15px; width: fit-content; }
    .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    
    /* Estilizacao geral dos botoes interativos */
    .btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: #eee;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s; /* Adiciona suavidade nas mudancas de estado do botao */
      user-select: none;
      min-width: 60px;
    }
    
    /* Efeitos de interacao do mouse sobre os botoes */
    .btn:hover { background: rgba(255,255,255,0.15); border-color: #ffdd55; color: #ffdd55; transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn.active { background: #ffdd55; color: #000; border-color: #ffdd55; }

    /* Variacoes de cores para botoes especificos */
    .btn-action { border-color: rgba(255,221,85,0.4); color: #ffdd55; }
    .btn-danger { border-color: rgba(255,85,85,0.4); color: #ff5555; }

    /* Painel lateral para exibicao da contagem de movimentos */
    #stats-panel { position: absolute; top: 20px; right: 20px; text-align: right; }
    .stat-label { font-size: 11px; color: #888; text-transform: uppercase; }
    .stat-value { font-size: 20px; font-weight: bold; color: #ffdd55; font-family: monospace; }

    /* Texto centralizado que aparece durante o processo de embaralhamento */
    #scramble-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      font-weight: bold;
      color: #ffdd55;
      text-transform: uppercase;
      letter-spacing: 4px;
      display: none; /* Oculto por padrao */
      text-shadow: 0 0 20px rgba(255,221,85,0.5);
    }
    /* Legenda de instrucoes no canto inferior esquerdo */
    .legend {
      position: absolute;
      bottom: 20px; left: 20px;
      font-size: 11px;
      color: #666;
      line-height: 1.6;
    }
    .legend span { color: #999; font-weight: bold; }
  </style>
</head>
<body>

  <div id="ui-container">
    <div id="header" class="panel">
      <h1>Cubo Magico 3D</h1>
      <p>Simulador Interativo Premium</p>
    </div>

    <div id="stats-panel" class="panel">
      <div class="stat-label">Movimentos</div>
      <div id="moveCount" class="stat-value">000</div>
    </div>

    <div id="scramble-overlay">Embaralhando...</div>

    <div id="controls-panel" class="panel">
      <div class="btn-group">
        <button class="btn" id="btnU" onclick="selectFace('U')">U (Cima)</button>
        <button class="btn" id="btnD" onclick="selectFace('D')">D (Baixo)</button>
        <button class="btn" id="btnL" onclick="selectFace('L')">L (Esq.)</button>
        <button class="btn" id="btnR" onclick="selectFace('R')">R (Dir.)</button>
        <button class="btn" id="btnF" onclick="selectFace('F')">F (Frente)</button>
        <button class="btn" id="btnB" onclick="selectFace('B')">B (Tras)</button>
      </div>
      <div class="btn-group">
        <button class="btn btn-action" onclick="rotateFace(1)">Horario (Enter)</button>
        <button class="btn btn-action" onclick="rotateFace(-1)">Anti-horario (Bksp)</button>
        <button class="btn btn-action" onclick="scramble()">Embaralhar (S)</button>
        <button class="btn btn-danger" onclick="resetCube()">Resetar</button>
      </div>
    </div>

    <div class="legend">
      <span>MOUSE:</span> Arrastar para orbitar | Scroll para zoom<br>
      <span>TECLAS:</span> U, D, L, R, F, B para selecionar faces
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
// INICIO DA CONFIGURACAO DA CENA 3D
    // Cria o ambiente principal onde os objetos serao adicionados
    const scene = new THREE.Scene();
    
    // Configura a camera em perspectiva (Angulo de visao, Proporcao de tela, Distancia minima, Distancia maxima)
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(6, 5, 8); // Posicao inicial da camera no espaco 3D


    //  Inicializa o motor de renderizacao WebGL
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // antialias suaviza bordas
    renderer.setSize(window.innerWidth, window.innerHeight); // Define o tamanho do canvas para cobrir a tela
    renderer.setPixelRatio(window.devicePixelRatio); // Mantem a nitidez em monitores de alta resolucao
    renderer.shadowMap.enabled = true; // Habilita o calculo de sombras
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Utiliza um algoritmo de sombra mais suave
    document.body.appendChild(renderer.domElement); // Adiciona o elemento <canvas> gerado ao corpo da pagina

    // CONFIGURACAO DE ILUMINACAO DE ESTUDIO
    // Luz ambiente preenche todo o espaco de forma homogenea, evitando sombras totalmente pretas
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    // Luz direcional principal, que simula um sol e projeta as sombras
    const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
    mainLight.position.set(5, 10, 7);
    mainLight.castShadow = true; // Permite que esta luz crie sombras
    mainLight.shadow.mapSize.width = 2048; // Qualidade da sombra gerada (Resolucao)
    mainLight.shadow.mapSize.height = 2048;
    scene.add(mainLight);

    // Luz de preenchimento para iluminar levemente os lados opostos a luz principal
    const fillLight = new THREE.DirectionalLight(0x8899ff, 0.4);
    fillLight.position.set(-5, 2, -5);
    scene.add(fillLight);

    // Luz de contorno vinda de baixo para destacar os limites do cubo contra o fundo
    const rimLight = new THREE.PointLight(0xffffff, 0.6);
    rimLight.position.set(0, -5, 0);
    scene.add(rimLight);

    // DEFINICAO DE CONSTANTES PARA A MODELAGEM DO CUBO
    const CUBIE_SIZE = 0.95; // Tamanho do corpo preto do cubinho (pouco menor que 1 para deixar espaco entre eles)
    const STICKER_SIZE = 0.82; // Tamanho do adesivo colorido
    const STICKER_THICKNESS = 0.02; // Espessura do adesivo
    const GAP = 0.05; // Margem visual (nao utilizada diretamente na matematica aqui, representada pelo CUBIE_SIZE)
    const STEP = 1.0; // Distancia entre o centro de um cubinho e o proximo

    // Mapeamento de cores hexadecimais para as faces
    const COLORS = {
      U: 0xffffff, // Branco (Up)
      D: 0xffd700, // Amarelo (Down)
      F: 0xc41e3a, // Vermelho (Front)
      B: 0xff5800, // Laranja (Back)
      L: 0x009e60, // Verde (Left)
      R: 0x0051ba, // Azul (Right)
      CORE: 0x111111 // Preto para o nucleo do material base
    };

    // ESTRUTURA DO CUBO
    const cubeGroup = new THREE.Group(); // Grupo que vai conter todas as pecas
    scene.add(cubeGroup);

    let cubies = []; // Array que armazenara as referencias logicas e os modelos 3D de cada peca

    // Funcao responsavel por criar um unico cubinho e seus adesivos nas posicoes x, y, z
    function createCubie(ix, iy, iz) {
      const cubieGroup = new THREE.Group(); // Sub-grupo para a peca individual
      cubieGroup.position.set(ix * STEP, iy * STEP, iz * STEP); // Posiciona baseado nos eixos (ex: -1, 0, 1)

      // Criacao do nucleo preto do cubinho
      const bodyGeo = new THREE.BoxGeometry(CUBIE_SIZE, CUBIE_SIZE, CUBIE_SIZE);
      const bodyMat = new THREE.MeshPhongMaterial({ color: COLORS.CORE, shininess: 100 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      body.receiveShadow = true;
      cubieGroup.add(body);

      // Criacao da geometria base para os adesivos
      const stickerGeo = new THREE.BoxGeometry(STICKER_SIZE, STICKER_SIZE, STICKER_THICKNESS);
      
      // Adiciona adesivo Superior se o cubinho estiver na camada mais alta de Y
      if (iy === 1) {
        const s = new THREE.Mesh(stickerGeo, new THREE.MeshPhongMaterial({ color: COLORS.U, shininess: 150 }));
        s.position.y = CUBIE_SIZE / 2; // Posiciona na extremidade superior da peca preta
        s.rotation.x = Math.PI / 2; // Gira 90 graus para ficar na horizontal
        cubieGroup.add(s);
      }
      // Adiciona adesivo Inferior se estiver na base de Y
      if (iy === -1) {
        const s = new THREE.Mesh(stickerGeo, new THREE.MeshPhongMaterial({ color: COLORS.D, shininess: 150 }));
        s.position.y = -CUBIE_SIZE / 2;
        s.rotation.x = -Math.PI / 2;
        cubieGroup.add(s);
      }
      // Adiciona adesivo Frontal se estiver na camada mais a frente de Z
      if (iz === 1) {
        const s = new THREE.Mesh(stickerGeo, new THREE.MeshPhongMaterial({ color: COLORS.F, shininess: 150 }));
        s.position.z = CUBIE_SIZE / 2;
        cubieGroup.add(s);
      }
      // Adiciona adesivo Traseiro se estiver no fundo de Z
      if (iz === -1) {
        const s = new THREE.Mesh(stickerGeo, new THREE.MeshPhongMaterial({ color: COLORS.B, shininess: 150 }));
        s.position.z = -CUBIE_SIZE / 2;
        s.rotation.y = Math.PI;
        cubieGroup.add(s);
      }
      // Adiciona adesivo Direito se estiver na borda positiva de X
      if (ix === 1) {
        const s = new THREE.Mesh(stickerGeo, new THREE.MeshPhongMaterial({ color: COLORS.R, shininess: 150 }));
        s.position.x = CUBIE_SIZE / 2;
        s.rotation.y = Math.PI / 2;
        cubieGroup.add(s);
      }
      // Adiciona adesivo Esquerdo se estiver na borda negativa de X
      if (ix === -1) {
        const s = new THREE.Mesh(stickerGeo, new THREE.MeshPhongMaterial({ color: COLORS.L, shininess: 150 }));
        s.position.x = -CUBIE_SIZE / 2;
        s.rotation.y = -Math.PI / 2;
        cubieGroup.add(s);
      }

      cubeGroup.add(cubieGroup); // Adiciona a peca pronta ao cubo completo
      return { mesh: cubieGroup, ix, iy, iz }; // Retorna as referencias para o array principal
    }

    // Funcao que itera pelas coordenadas criando todas as 26 pecas do cubo
    function initCube() {
      // Limpa os objetos da cena caso esteja reiniciando o cubo
      while(cubeGroup.children.length > 0) cubeGroup.remove(cubeGroup.children[0]);
      cubies = [];
      
      // Loops alinhados em 3D: X, Y, Z variam de -1 a 1
      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
            if (x === 0 && y === 0 && z === 0) continue; // Pula a iteracao no nucleo central, pois ele e vazio
            cubies.push(createCubie(x, y, z));
          }
        }
      }
    }

    // Dispara a geracao do modelo assim que o codigo chega aqui
    initCube();
    // INICIO DA LOGICA DE ANIMACAO E INTERACAO

    // Dicionario que define como cada face deve girar. 
    // Eixo de rotacao (Vector3) e a regra para identificar quais cubos pertencem aquela face.
    const FACE_AXIS = {
      U: { axis: new THREE.Vector3(0, 1, 0), coord: 'iy', val: 1 },
      D: { axis: new THREE.Vector3(0, -1, 0), coord: 'iy', val: -1 },
      F: { axis: new THREE.Vector3(0, 0, 1), coord: 'iz', val: 1 },
      B: { axis: new THREE.Vector3(0, 0, -1), coord: 'iz', val: -1 },
      R: { axis: new THREE.Vector3(1, 0, 0), coord: 'ix', val: 1 },
      L: { axis: new THREE.Vector3(-1, 0, 0), coord: 'ix', val: -1 }
    };

    // Variaveis de controle de estado
    let selectedFace = null;
    let isAnimating = false;
    let moveCount = 0;

    // Funcao ativada pelos botoes ou teclado para preparar qual face sera girada
    function selectFace(face) {
      if (isAnimating) return; // Bloqueia a selecao se uma animacao ja estiver rodando
      selectedFace = face;
      // Atualiza a interface, ativando visualmente apenas o botao da face escolhida
      ['U','D','L','R','F','B'].forEach(f => {
        document.getElementById('btn' + f).classList.toggle('active', f === face);
      });
    }

    // Aciona o inicio do giro com base na direcao solicitada (1 horario, -1 anti-horario)
    function rotateFace(dir) {
      if (isAnimating || !selectedFace) return;
      animateRotation(selectedFace, dir);
    }

    // Funcao principal que gerencia o calculo geometrico da animacao de giro
    function animateRotation(face, dir, speed = 0.3) {
      isAnimating = true;
      const config = FACE_AXIS[face];
      
      // 1. Filtra na matriz de cubos quais deles pertencem a face que deve girar
      const activeCubies = cubies.filter(c => Math.round(c[config.coord]) === config.val);
      
      // 2. Cria um grupo temporario no centro da tela para atuar como pivo da rotacao
      const pivot = new THREE.Group();
      scene.add(pivot);
      
      // Move os blocos filtrados do cubo principal para este pivo temporario
      activeCubies.forEach(c => {
        cubeGroup.remove(c.mesh);
        pivot.add(c.mesh);
      });

      // 3. Calculos matematicos da animacao
      const targetAngle = (Math.PI / 2) * dir; // Calcula 90 graus radianos multiplicados pela direcao
      const startTime = performance.now(); // Marca o tempo de inicio da animacao

      // Funcao rodando a cada frame para calcular o progresso
      function update() {
        const now = performance.now();
        const elapsed = (now - startTime) / 1000; // Converte milissegundos decorridos para segundos
        const t = Math.min(elapsed / speed, 1); // Normaliza o progresso entre 0 e 1
        
        // Aplica uma equacao de Easing (Smoothstep) para a animacao comecar e terminar de forma suave
        const easedT = t * t * (3 - 2 * t);
        const angle = targetAngle * easedT;
        
        // Rotaciona o grupo pivo na quantidade calculada
        pivot.setRotationFromAxisAngle(config.axis, angle);

        // Se a animacao nao acabou, pede para rodar o update no proximo frame
        if (t < 1) {
          requestAnimationFrame(update);
        } else {
          // Quando atinge o final do giro (t = 1)
          pivot.updateMatrixWorld(true); // Atualiza e sela as matrizes matematicas globais
          
          activeCubies.forEach(c => {
            // Repassa a matriz de transformacao espacial final do pivo para cada cubo individual
            c.mesh.applyMatrix4(pivot.matrixWorld);
            pivot.remove(c.mesh);
            cubeGroup.add(c.mesh); // Retorna a peca ao grupo principal
            
            // Recalcula e salva em qual quadrante logico (x, y, z) a peca parou apos o giro
            const pos = new THREE.Vector3();
            c.mesh.getWorldPosition(pos);
            c.ix = Math.round(pos.x / STEP);
            c.iy = Math.round(pos.y / STEP);
            c.iz = Math.round(pos.z / STEP);
          });
          
          scene.remove(pivot); // Destroi o pivo temporario
          isAnimating = false; // Libera o sistema para receber novos comandos
          
          // Incrementa e atualiza os contadores na tela se for uma jogada humana (speed lento)
          if (speed > 0.1) {
            moveCount++;
            document.getElementById('moveCount').textContent = moveCount.toString().padStart(3, '0');
          }
        }
      }
      
      update(); // Da o disparo inicial no loop do frame
    }

    // Funcao assincrona para realizar giros rapidos aleatorios simulando embaralhamento
    async function scramble() {
      if (isAnimating) return;
      document.getElementById('scramble-overlay').style.display = 'block'; // Exibe o texto de embaralhando
      const faces = ['U','D','L','R','F','B'];
      
      // Roda um loop 20 vezes girando uma face aleatoria bem rapidamente
      for (let i = 0; i < 20; i++) {
        const face = faces[Math.floor(Math.random() * 6)];
        const dir = Math.random() > 0.5 ? 1 : -1;
        animateRotation(face, dir, 0.1); // Chama a animacao com velocidade em 0.1s
        await new Promise(r => setTimeout(r, 120)); // Forca o loop a aguardar 120ms entre cada giro
      }
      
      document.getElementById('scramble-overlay').style.display = 'none'; // Esconde texto e zera contadores
      moveCount = 0;
      document.getElementById('moveCount').textContent = '000';
    }

    // Reposiciona todos os dados para a estrutura inicial
    function resetCube() {
      if (isAnimating) return;
      initCube();
      moveCount = 0;
      document.getElementById('moveCount').textContent = '000';
      selectedFace = null;
      ['U','D','L','R','F','B'].forEach(f => document.getElementById('btn' + f).classList.remove('active'));
    }

    // CONTROLES DE CAMERA ORBITAL USANDO COORDENADAS ESFERICAS
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let theta = Math.PI / 4; // Angulo de giro horizontal
    let phi = Math.PI / 4; // Angulo de giro vertical
    let radius = 10; // Distancia da camera para o centro do cubo

    // Atualiza matematicamente a posicao 3D da lente da camera baseada nos angulos
    function updateCamera() {
      camera.position.x = radius * Math.sin(phi) * Math.sin(theta);
      camera.position.y = radius * Math.cos(phi);
      camera.position.z = radius * Math.sin(phi) * Math.cos(theta);
      camera.lookAt(0, 0, 0); // Forca a lente a sempre encarar o centro absoluto da cena
    }

    // Trata eventos do mouse para iniciar o arrasto da camera
    window.addEventListener('mousedown', e => { isDragging = true; });
    window.addEventListener('mouseup', e => { isDragging = false; });
    
    // Calcula o deslocamento do mouse e altera os angulos de rotacao global
    window.addEventListener('mousemove', e => {
      if (isDragging) {
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;
        theta -= deltaX * 0.01;
        // Restringe o angulo vertical para nao virar de cabeca para baixo
        phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi - deltaY * 0.01));
        updateCamera();
      }
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    // Detecta o movimento da roda do mouse para aproximar ou afastar o raio da camera
    window.addEventListener('wheel', e => {
      radius = Math.max(5, Math.min(20, radius + e.deltaY * 0.01));
      updateCamera();
    });

    // SISTEMA DE CAPTURA DE TECLAS DO TECLADO
    window.addEventListener('keydown', e => {
      const key = e.key.toUpperCase(); // Padroniza tudo para letras maiusculas
      if (['U','D','L','R','F','B'].includes(key)) selectFace(key); // Aciona selecao de faces
      if (e.key === 'Enter') rotateFace(1); // Aciona o giro
      if (e.key === 'Backspace') rotateFace(-1);
      if (key === 'S') scramble(); // Aciona modo de embaralhamento
    });

    // LOOP DE RENDERIZACAO PRINCIPAL
    // Esta funcao e o coracao do codigo grafico, executando infinitamente no ritmo da taxa de atualizacao do monitor
    function animate() {
      requestAnimationFrame(animate); // Solicita ao navegador a proxima chamada desta funcao
      renderer.render(scene, camera); // Desenha os calculos graficos visuais no canvas
    }
    
    // Atualiza a proporcao da camera caso o usuario altere o tamanho ou rotacione a tela do dispositivo
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Execucoes iniciais unicas
    updateCamera(); // Posiciona a camera na inicializacao
    animate(); // Da a partida no loop grafico contínuo

      </script>
</body>
</html>
